[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpm-digital-twin"
version = "1.0.0"
description = "Digital Twin Software for Random Positioning Machine - Microgravity Simulation Platform"
readme = "README.md"
license = {text = "Proprietary - Space Research Applications"}
requires-python = ">=3.10"
authors = [
    {name = "RPM Digital Twin Team", email = "contact@rpm-digitaltwin.space"}
]
keywords = [
    "microgravity", "random-positioning-machine", "digital-twin", 
    "space-research", "simulation", "ISRO", "NASA", "astrobiology"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core GUI Framework
    "PyQt6>=6.6.0",
    "pyqtgraph>=0.13.3",
    
    # Scientific Computing
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    
    # Plotting & Visualization
    "matplotlib>=3.8.0",
    "vtk>=9.3.0",
    "pyvista>=0.43.0",
    
    # Serial Communication (Arduino/RPi)
    "pyserial>=3.5",
    
    # Data Export & Processing
    "h5py>=3.10.0",
    "openpyxl>=3.1.0",
    
    # Configuration & Logging
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    
    # Cross-platform utilities
    "platformdirs>=4.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

paraview = [
    "paraview>=5.11.0",
]

[project.scripts]
rpm-twin = "rpm_digital_twin.main:main"

[project.gui-scripts]
rpm-twin-gui = "rpm_digital_twin.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
