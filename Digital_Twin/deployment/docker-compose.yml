#!/bin/bash
# Docker compose for production-like deployment

version: "3.8"

services:
  postgres:
    image: timescale/timescaledb:latest-pg14
    environment:
      POSTGRES_USER: rpm_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_DB: rpm_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpm_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: src/backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://rpm_user:${DB_PASSWORD:-secure_password}@postgres:5432/rpm_prod
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - "3000:3000"

  analytics:
    build:
      context: src/analytics
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production

  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - backend
    ports:
      - "80:3000"
    environment:
      REACT_APP_API_URL: http://backend:3000

volumes:
  postgres_data:
